            "ar": "<div dir='rtl' style='text-align: right;'><p><b>نوع الكلمة:</b> ظرف</p><p><b>الشرح 1:</b> يشير إلى حدوث شيء مبكراً أو قبل المعتاد.</p><p><b>المثال 1:</b> استيقظت <b>في وقت أبكر</b> اليوم.</p><p><b>الشرح 2:</b> يستخدم مع النفي (ليس قبل) لإظهار أن شيئاً سيحدث لاحقاً.</p><p><b>المثال 2:</b> لن يصل <b>قبل</b> الغد.</p></div>",

            "no": "<p><b>Ordklasse:</b> Adverb</p><p><b>Forklaring 1:</b> Refererer til at noe skjer tidlig, eller tidligere enn vanlig.</p><p><b>Eksempel 1:</b> Jeg våknet <b>tidligere</b> i dag.</p><p><b>Forklaring 2:</b> Ofte brukt med nektelse (ikke før) for å vise at noe skjer sent.</p><p><b>Eksempel 2:</b> Han kommer ikke <b>før</b> i morgen.</p>",

            "no": "<p><b>Ordklasse:</b> Preposisjon</p><p><b>Forklaring 1:</b> Å bevege seg inn og ut av et rom.</p><p><b>Eksempel 1:</b> Vi kjørte <b>gjennom</b> tunnelen.</p><p><b>Forklaring 2:</b> Å lese eller undersøke noe fra start til slutt.</p><p><b>Eksempel 2:</b> Jeg leste <b>gjennom</b> boken.</p>",
            "fa": "<div dir='rtl' style='text-align: right;'><p><b>نوع کلمه:</b> حرف اضافه</p><p><b>توضیح 1:</b> وارد شدن از یک طرف و خارج شدن از طرف دیگر یک فضا.</p><p><b>مثال 1:</b> ما <b>از میان</b> تونل رانندگی کردیم.</p><p><b>توضیح 2:</b> خواندن یا بررسی یک مطلب از ابتدا تا انتها.</p><p><b>مثال 2:</b> من کتاب را <b>به طور کامل (از اول تا آخر)</b> خواندم.</p></div>",
            "pl": "<p><b>Część mowy:</b> Przyimek</p><p><b>Wyjaśnienie 1:</b> Wejście z jednej strony i wyjście z drugiej w przestrzeni.</p><p><b>Przykład 1:</b> Przejechaliśmy <b>przez</b> tunel.</p><p><b>Wyjaśnienie 2:</b> Przeczytanie lub przejrzenie materiału od początku do końca.</p><p><b>Przykład 2:</b> Przeczytałem <b>całą</b> książkę.</p>",
            "ru": "<p><b>Часть речи:</b> Предлог</p><p><b>Объяснение 1:</b> Войти с одной стороны и выйти с другой (в пространстве).</p><p><b>Пример 1:</b> Мы проехали <b>через</b> туннель.</p><p><b>Объяснение 2:</b> Прочитать или изучить материал от начала до конца.</p><p><b>Пример 2:</b> Я прочитал книгу <b>целиком (насквозь)</b>.</p>",
            "es": "<p><b>Clase de palabra:</b> Preposición</p><p><b>Explicación 1:</b> Entrar por un lado y salir por el otro en un espacio.</p><p><b>Ejemplo 1:</b> Conducimos <b>a través</b> del túnel.</p><p><b>Explicación 2:</b> Leer o examinar material de principio a fin.</p><p><b>Ejemplo 2:</b> Leí el libro <b>entero (de principio a fin)</b>.</p>",
            "sv": "<p><b>Ordklass:</b> Preposition</p><p><b>Förklaring 1:</b> Att röra sig in genom och ut ur ett utrymme.</p><p><b>Exempel 1:</b> Vi körde <b>genom</b> tunneln.</p><p><b>Förklaring 2:</b> Att läsa eller granska något från början till slut.</p><p><b>Exempel 2:</b> Jag läste <b>igenom</b> boken.</p>",
            "th": "<p><b>ชนิดของคำ:</b> คำบุพบท</p><p><b>คำอธิบาย 1:</b> การเข้าไปทางหนึ่งและออกอีกทางหนึ่งในพื้นที่</p><p><b>ตัวอย่าง 1:</b> เราขับรถ<b>ผ่าน</b>อุโมงค์</p><p><b>คำอธิบาย 2:</b> การอ่านหรือตรวจสอบวัสดุตั้งแต่ต้นจนจบ</p><p><b>ตัวอย่าง 2:</b> ฉันอ่านหนังสือ<b>จนจบ</b></p>",
            "uk": "<p><b>Частина мови:</b> Прийменник</p><p><b>Пояснення 1:</b> Увійти з одного боку і вийти з іншого (у просторі).</p><p><b>Приклад 1:</b> Ми проїхали <b>через</b> тунель.</p><p><b>Пояснення 2:</b> Прочитати або вивчити матеріал від початку до кінця.</p><p><b>Приклад 2:</b> Я прочитав книгу <b>повністю (наскрізь)</b>.</p>",
            "vi": "<p><b>Loại từ:</b> Giới từ</p><p><b>Giải thích 1:</b> Đi vào một bên và đi ra bên kia của một không gian.</p><p><b>Ví dụ 1:</b> Chúng tôi lái xe <b>xuyên qua</b> đường hầm.</p><p><b>Giải thích 2:</b> Đọc hoặc kiểm tra tài liệu từ đầu đến cuối.</p><p><b>Ví dụ 2:</b> Tôi đã đọc <b>xuyên suốt</b> cuốn sách.</p>"

    {

        translations: {
            "ar": "<div dir='rtl' style='text-align: right;'><p><b>نوع الكلمة:</b> ظرف</p><p><b>الشرح 1:</b> يوضح أن شيئاً ما أكثر من اللازم أو مفرط.</p><p><b>المثال 1:</b> الحساء حار <b>جداً (بشكل مفرط)</b>.</p><p><b>الشرح 2:</b> يستخدم عندما يحدث شيء متأخراً أو مبكراً أكثر من اللازم.</p><p><b>المثال 2:</b> وصل إلى الاجتماع متأخراً <b>جداً</b>.</p></div>",
            "da": "<p><b>Ordklasse:</b> Biord (Adverbium)</p><p><b>Forklaring 1:</b> Viser, at noget er overdrevet eller mere end passende.</p><p><b>Eksempel 1:</b> Suppen er <b>for</b> varm.</p><p><b>Forklaring 2:</b> Bruges, når noget sker for sent eller for tidligt.</p><p><b>Eksempel 2:</b> Han kom <b>for</b> sent til mødet.</p>",

            "tl": "<p><b>Bahagi ng pananalita:</b> Pang-abay</p><p><b>Paliwanag 1:</b> Nagpapakita na ang isang bagay ay labis o sobra.</p><p><b>Halimbawa 1:</b> <b>Sobra</b>ng init ng sabaw.</p><p><b>Paliwanag 2:</b> Ginagamit kapag ang isang bagay ay nangyari nang huli o maaga masyado.</p><p><b>Halimbawa 2:</b> Dumating siyang <b>sobrang</b> huli para sa miting.</p>",
            "no": "<p><b>Ordklasse:</b> Adverb</p><p><b>Forklaring 1:</b> Viser at noe er overdrevet eller mer enn passende.</p><p><b>Eksempel 1:</b> Suppen er <b>for</b> varm.</p><p><b>Forklaring 2:</b> Brukes når noe skjer for sent eller for tidlig.</p><p><b>Eksempel 2:</b> Han kom <b>for</b> sent til møtet.</p>",
            "fa": "<div dir='rtl' style='text-align: right;'><p><b>نوع کلمه:</b> قید</p><p><b>توضیح 1:</b> نشان می‌دهد چیزی بیش از حد یا نامناسب است.</p><p><b>مثال 1:</b> سوپ <b>بیش از حد</b> داغ است.</p><p><b>توضیح 2:</b> زمانی استفاده می‌شود که چیزی خیلی دیر یا خیلی زود اتفاق بیفتد.</p><p><b>مثال 2:</b> او <b>خیلی (بیش از حد)</b> دیر به جلسه رسید.</p></div>",
            "pl": "<p><b>Część mowy:</b> Przysłówek</p><p><b>Wyjaśnienie 1:</b> Pokazuje, że czegoś jest więcej niż powinno (zbyt).</p><p><b>Przykład 1:</b> Zupa jest <b>zbyt</b> gorąca.</p><p><b>Wyjaśnienie 2:</b> Używane, gdy coś dzieje się zbyt późno lub zbyt wcześnie.</p><p><b>Przykład 2:</b> Przyszedł na spotkanie <b>zbyt</b> późno.</p>",
            "ru": "<p><b>Часть речи:</b> Наречие</p><p><b>Объяснение 1:</b> Показывает, что чего-то больше, чем нужно (слишком).</p><p><b>Пример 1:</b> Суп <b>слишком</b> горячий.</p><p><b>Объяснение 2:</b> Используется, когда что-то происходит слишком поздно или слишком рано.</p><p><b>Пример 2:</b> Он пришел на встречу <b>слишком</b> поздно.</p>",
            "es": "<p><b>Clase de palabra:</b> Adverbio</p><p><b>Explicación 1:</b> Muestra que algo es excesivo o más que apropiado.</p><p><b>Ejemplo 1:</b> La sopa está <b>demasiado</b> caliente.</p><p><b>Explicación 2:</b> Se usa cuando algo sucede demasiado tarde o demasiado temprano.</p><p><b>Ejemplo 2:</b> Llegó <b>demasiado</b> tarde a la reunión.</p>",
            "sv": "<p><b>Ordklass:</b> Adverb</p><p><b>Förklaring 1:</b> Visar att något är överdrivet eller mer än lämpligt.</p><p><b>Exempel 1:</b> Soppan är <b>för</b> varm.</p><p><b>Förklaring 2:</b> Används när något händer för sent eller för tidigt.</p><p><b>Exempel 2:</b> Han kom <b>för</b> sent till mötet.</p>",
            "th": "<p><b>ชนิดของคำ:</b> กริยาวิเศษณ์</p><p><b>คำอธิบาย 1:</b> แสดงว่าสิ่งใดสิ่งหนึ่งมากเกินความเหมาะสม</p><p><b>ตัวอย่าง 1:</b> ซุปร้อน<b>เกินไป</b></p><p><b>คำอธิบาย 2:</b> ใช้เมื่อมีบางสิ่งเกิดขึ้นสายเกินไปหรือเร็วเกินไป</p><p><b>ตัวอย่าง 2:</b> เขามาประชุมสาย<b>เกินไป</b></p>",
            "uk": "<p><b>Частина мови:</b> Прислівник</p><p><b>Пояснення 1:</b> Показує, що чогось більше, ніж потрібно (занадто).</p><p><b>Приклад 1:</b> Суп <b>занадто</b> гарячий.</p><p><b>Пояснення 2:</b> Використовується, коли щось відбувається занадто пізно або занадто рано.</p><p><b>Приклад 2:</b> Він прийшов на зустріч <b>занадто</b> пізно.</p>",
            "vi": "<p><b>Loại từ:</b> Trạng từ</p><p><b>Giải thích 1:</b> Cho thấy một điều gì đó vượt mức hoặc quá mức thích hợp.</p><p><b>Ví dụ 1:</b> Súp <b>quá</b> nóng.</p><p><b>Giải thích 2:</b> Dùng khi việc gì đó xảy ra quá muộn hoặc quá sớm.</p><p><b>Ví dụ 2:</b> Anh ấy đến cuộc họp <b>quá</b> muộn.</p>"

    {

        translations: {
            "ar": "<div dir='rtl' style='text-align: right;'><p><b>نوع الكلمة:</b> ظرف</p><p><b>الشرح 1:</b> يستخدم مع النفي للتأكيد (على الإطلاق).</p><p><b>المثال 1:</b> هذا لم يكن سيئاً <b>على الإطلاق</b>.</p><p><b>الشرح 2:</b> يعني الإجمالي عند الحديث عن العدد أو الكمية.</p><p><b>المثال 2:</b> كلف هذا ألف كرونا <b>إجمالاً</b>.</p></div>",
            "da": "<p><b>Ordklasse:</b> Biord (Adverbium)</p><p><b>Forklaring 1:</b> Bruges med benægtelse for at forstærke den (slet ikke).</p><p><b>Eksempel 1:</b> Det var <b>slet</b> ikke dårligt.</p><p><b>Forklaring 2:</b> Betyder i alt eller samlet, når man taler om mængder.</p><p><b>Eksempel 2:</b> Det kostede <b>i alt</b> tusind kroner.</p>",
            "en": "<p><b>Word class:</b> Adverb</p><p><b>Explanation 1:</b> Used with negation for emphasis (not at all).</p><p><b>Example 1:</b> This was not bad <b>at all</b>.</p><p><b>Explanation 2:</b> Means in total or altogether when talking about numbers or amounts.</p><p><b>Example 2:</b> This cost a thousand krónur <b>in total</b>.</p>",

            "no": "<p><b>Ordklasse:</b> Adverb</p><p><b>Forklaring 1:</b> Brukes med nektelse for å forsterke den (slett ikke).</p><p><b>Eksempel 1:</b> Dette var <b>slett</b> ikke verst.</p><p><b>Forklaring 2:</b> Betyr totalt eller til sammen når man snakker om mengder.</p><p><b>Eksempel 2:</b> Dette kostet <b>totalt</b> tusen kroner.</p>",
            "fa": "<div dir='rtl' style='text-align: right;'><p><b>نوع کلمه:</b> قید</p><p><b>توضیح 1:</b> همراه با منفی برای تاکید استفاده می‌شود (اصلاً).</p><p><b>مثال 1:</b> این <b>اصلاً</b> بد نبود.</p><p><b>توضیح 2:</b> هنگام صحبت در مورد اعداد به معنای در مجموع است.</p><p><b>مثال 2:</b> این <b>در مجموع</b> هزار کرون هزینه داشت.</p></div>",
            "pl": "<p><b>Część mowy:</b> Przysłówek</p><p><b>Wyjaśnienie 1:</b> Używane z przeczeniem dla wzmocnienia (wcale nie).</p><p><b>Przykład 1:</b> To <b>wcale</b> nie było złe.</p><p><b>Wyjaśnienie 2:</b> Oznacza łącznie lub w sumie, gdy mówimy o ilości.</p><p><b>Przykład 2:</b> To kosztowało <b>łącznie</b> tysiąc koron.</p>",
            "ru": "<p><b>Часть речи:</b> Наречие</p><p><b>Объяснение 1:</b> Используется с отрицанием для усиления (вовсе не, совсем не).</p><p><b>Пример 1:</b> Это было <b>совсем</b> не плохо.</p><p><b>Объяснение 2:</b> Означает в общей сложности или всего при разговоре о количестве.</p><p><b>Пример 2:</b> Это стоило <b>всего</b> тысячу крон.</p>",
            "es": "<p><b>Clase de palabra:</b> Adverbio</p><p><b>Explicación 1:</b> Se usa con negación para dar énfasis (en absoluto / para nada).</p><p><b>Ejemplo 1:</b> Esto no estuvo mal <b>en absoluto</b>.</p><p><b>Explicación 2:</b> Significa en total cuando se habla de números o cantidades.</p><p><b>Ejemplo 2:</b> Esto costó mil coronas <b>en total</b>.</p>",
            "sv": "<p><b>Ordklass:</b> Adverb</p><p><b>Förklaring 1:</b> Används med negation för att förstärka den (alls inte).</p><p><b>Exempel 1:</b> Det var <b>alls</b> inte dåligt.</p><p><b>Förklaring 2:</b> Betyder totalt eller sammanlagt när man pratar om mängder.</p><p><b>Exempel 2:</b> Detta kostade <b>totalt</b> tusen kronor.</p>",
            "th": "<p><b>ชนิดของคำ:</b> กริยาวิเศษณ์</p><p><b>คำอธิบาย 1:</b> ใช้กับการปฏิเสธเพื่อเน้นย้ำ (ไม่...เลย)</p><p><b>ตัวอย่าง 1:</b> มันไม่ได้แย่<b>เลย</b></p><p><b>คำอธิบาย 2:</b> หมายถึงโดยรวมทั้งหมดเมื่อพูดถึงจำนวน</p><p><b>ตัวอย่าง 2:</b> สิ่งนี้ราคาหนึ่งพันโครนา<b>รวมทั้งหมด</b></p>",
            "uk": "<p><b>Частина мови:</b> Прислівник</p><p><b>Пояснення 1:</b> Використовується із запереченням для підсилення (зовсім не).</p><p><b>Приклад 1:</b> Це було <b>зовсім</b> не погано.</p><p><b>Пояснення 2:</b> Означає загалом або всього, коли йдеться про кількість.</p><p><b>Приклад 2:</b> Це коштувало <b>всього</b> тисячу крон.</p>",
            "vi": "<p><b>Loại từ:</b> Trạng từ</p><p><b>Giải thích 1:</b> Dùng với câu phủ định để nhấn mạnh (không chút nào).</p><p><b>Ví dụ 1:</b> Điều này không tệ <b>chút nào</b>.</p><p><b>Giải thích 2:</b> Có nghĩa là tổng cộng khi nói về số lượng hoặc lượng.</p><p><b>Ví dụ 2:</b> Chi phí này <b>tổng cộng</b> là một ngàn krónur.</p>"

        translations: {

            "tl": "<p><b>Bahagi ng pananalita:</b> Panghalip paari</p><p><b>Paliwanag 1:</b> Tumutukoy sa pag-aari ng isang tao.</p><p><b>Halimbawa 1:</b> Naglaro ang bata sa <b>kanyang</b> laruan.</p><p><b>Paliwanag 2:</b> Ginagamit para ipamahagi ang mga bagay nang pantay (bawat isa sa kanila).</p><p><b>Halimbawa 2:</b> Nakatanggap sila ng mansanas <b>bawat isa</b>.</p>",
            "no": "<p><b>Ordklasse:</b> Eiendomsord (Pronomen)</p><p><b>Forklaring 1:</b> Refererer til det noen eier (sitt).</p><p><b>Eksempel 1:</b> Barnet lekte med leketøyet <b>sitt</b>.</p><p><b>Forklaring 2:</b> Brukes ved fordeling av ting (hver sitt).</p><p><b>Eksempel 2:</b> De fikk <b>hvert sitt</b> eple.</p>",
            "fa": "<div dir='rtl' style='text-align: right;'><p><b>نوع کلمه:</b> ضمیر ملکی</p><p><b>توضیح 1:</b> به آنچه کسی مالک آن است یا متعلق به اوست اشاره دارد.</p><p><b>مثال 1:</b> کودک با اسباب‌بازی <b>خودش</b> بازی کرد.</p><p><b>توضیح 2:</b> برای توزیع مساوی چیزها بین افراد استفاده می‌شود (هر کدام مال خود را).</p><p><b>مثال 2:</b> آنها <b>هر کدام</b> یک سیب دریافت کردند.</p></div>",
            "pl": "<p><b>Część mowy:</b> Zaimek dzierżawczy</p><p><b>Wyjaśnienie 1:</b> Odnosi się do własności (swój/swoje).</p><p><b>Przykład 1:</b> Dziecko bawiło się <b>swoją</b> zabawką.</p><p><b>Wyjaśnienie 2:</b> Używane do rozdziału rzeczy (każdemu swoje).</p><p><b>Przykład 2:</b> Dostali <b>po jednym (swoim)</b> jabłku.</p>",
            "ru": "<p><b>Часть речи:</b> Притяжательное местоимение</p><p><b>Объяснение 1:</b> Указывает на принадлежность (свой/своё).</p><p><b>Пример 1:</b> Ребенок играл со <b>своей</b> игрушкой.</p><p><b>Объяснение 2:</b> Используется для распределения вещей (каждый своё).</p><p><b>Пример 2:</b> Они получили <b>каждый по своему</b> яблоку.</p>",
            "es": "<p><b>Clase de palabra:</b> Pronombre posesivo</p><p><b>Explicación 1:</b> Se refiere a lo que alguien posee (su / suyo).</p><p><b>Ejemplo 1:</b> El niño jugó con <b>su</b> juguete.</p><p><b>Explicación 2:</b> Se utiliza para distribuir cosas (cada uno lo suyo).</p><p><b>Ejemplo 2:</b> Recibieron una manzana <b>cada uno</b>.</p>",
            "sv": "<p><b>Ordklass:</b> Possessivt pronomen</p><p><b>Förklaring 1:</b> Refererar till vad någon äger (sitt).</p><p><b>Exempel 1:</b> Barnet lekte med <b>sin/sitt</b> leksak.</p><p><b>Förklaring 2:</b> Används för att fördela saker (varsitt).</p><p><b>Exempel 2:</b> De fick <b>varsitt</b> äpple.</p>",
            "th": "<p><b>ชนิดของคำ:</b> สรรพนามแสดงความเป็นเจ้าของ</p><p><b>คำอธิบาย 1:</b> แสดงความเป็นเจ้าของของบางคน (ของเขา)</p><p><b>ตัวอย่าง 1:</b> เด็กเล่นกับของเล่น<b>ของเขา</b></p><p><b>คำอธิบาย 2:</b> ใช้แจกจ่ายสิ่งของเท่า ๆ กัน (แต่ละคน)</p><p><b>ตัวอย่าง 2:</b> พวกเขาได้รับแอปเปิ้ลคนละลูก (ของ<b>แต่ละคน</b>)</p>",

            "fa": "<div dir='rtl' style='text-align: right;'><p><b>نوع کلمه:</b> ضمیر / کلمه پرسشی</p><p><b>توضیح 1:</b> در مورد جهت یا مقصد می‌پرسد (کجا / به کجا).</p><p><b>مثال 1:</b> <b>کجا</b> داری می‌روی؟</p><p><b>توضیح 2:</b> همچنین یک ضمیر نامعین به معنای 'هر یک' یا 'همه'.</p><p><b>مثال 2:</b> <b>هر</b> کودک یک هدیه کوچک دریافت می‌کند.</p></div>",
            "pl": "<p><b>Część mowy:</b> Zaimek / Zaimek pytający</p><p><b>Wyjaśnienie 1:</b> Zaimek pytający o kierunek lub cel podróży (dokąd).</p><p><b>Przykład 1:</b> <b>Dokąd</b> idziesz?</p><p><b>Wyjaśnienie 2:</b> Także zaimek nieokreślony oznaczający 'każde' lub 'wszyscy'.</p><p><b>Przykład 2:</b> <b>Każde</b> dziecko otrzymuje mały prezent.</p>",
            "ru": "<p><b>Часть речи:</b> Местоимение / Вопросительное слово</p><p><b>Объяснение 1:</b> Спрашивает о направлении или пункте назначения (куда).</p><p><b>Пример 1:</b> <b>Куда</b> ты идешь?</p><p><b>Объяснение 2:</b> Также неопределенное местоимение, означающее 'каждый'.</p><p><b>Пример 2:</b> <b>Каждый</b> ребенок получает небольшой подарок.</p>",

            "uk": "<p><b>Частина мови:</b> Займенник / Питальне слово</p><p><b>Пояснення 1:</b> Запитує про напрямок або пункт призначення (куди).</p><p><b>Приклад 1:</b> <b>Куди</b> ти йдеш?</p><p><b>Пояснення 2:</b> Також неозначений займенник, що означає 'кожен'.</p><p><b>Приклад 2:</b> <b>Кожна</b> дитина отримує невеликий подарунок.</p>",
            "vi": "<p><b>Loại từ:</b> Đại từ / Từ để hỏi</p><p><b>Giải thích 1:</b> Hỏi về hướng đi hoặc điểm đến (đi đâu).</p><p><b>Ví dụ 1:</b> Bạn đang đi <b>đâu</b> vậy?</p><p><b>Giải thích 2:</b> Cũng là một đại từ bất định có nghĩa là 'mỗi' hoặc 'mọi'.</p><p><b>Ví dụ 2:</b> <b>Mỗi</b> đứa trẻ đều nhận được một món quà nhỏ.</p>"

let userScores = new Array(exerciseData.length).fill(null);
let userSpoken = new Array(exerciseData.length).fill("");

let currentIndex = 0;
let recognition;
let isRecording = false;
let autoAdvanceTimer = null;
let hasDownloadedCert = false;

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = 'is-IS';
    recognition.continuous = false;
    recognition.interimResults = false;
    
    recognition.onend = () => {
        isRecording = false;
        const btn = document.getElementById('record-btn');
        if (btn) {
            btn.innerText = "🎤 Tala";
            btn.classList.remove('recording');
        }
        const resDiv = document.getElementById('result');
        if (resDiv && resDiv.innerText === "Hlusta...") {
            resDiv.innerText = "";
        }
    };
} else {
    alert("Þessi vafri styður ekki talgreiningu. Notaðu Chrome eða Edge á tölvu.");
}

window.onload = () => { 
    updateUI();
};

function updateProgress() {
    let correctCount = 0;
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] === 100) correctCount++;
    }
    const percent = (correctCount / exerciseData.length) * 100;
    const progressBar = document.getElementById('progress-bar');
    if(progressBar) progressBar.style.width = percent + '%';
    return correctCount;
}

function findNextUnfinished() {
    for (let i = 0; i < userScores.length; i++) {
        if (userScores[i] !== 100) {
            currentIndex = i;
            break;
        }
    }
    document.getElementById('completion-view').style.display = 'none';
    document.getElementById('exercise-view').style.display = 'block';
    updateUI();
}

function updateUI() {
    clearTimeout(autoAdvanceTimer); 
    const correctCount = updateProgress();

    if (currentIndex >= exerciseData.length) {
        document.getElementById('exercise-view').style.display = 'none';
        const completionView = document.getElementById('completion-view');
        completionView.style.display = 'block';

        if (correctCount === exerciseData.length) {
            completionView.innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: 100%;"></div></div>
                <h1 style="color: #34a853; font-size: 2.5em;">Frábært! Þú náðir 100% árangri! 🎉</h1>
                <p style="font-size: 1.2em; color: #555;">Skrifaðu nafnið þitt hér að neðan til að sækja viðurkenningarskjalið þitt.</p>
                <input type="text" id="studentName" placeholder="Skrifaðu nafnið þitt hér" autocomplete="off" ${hasDownloadedCert ? 'disabled' : ''}><br>
                <button id="cert-btn" class="btn" style="background-color: ${hasDownloadedCert ? '#5f6368' : '#1a73e8'}; font-size: 1.5em; padding: 15px 30px; margin-top: 10px; cursor: ${hasDownloadedCert ? 'not-allowed' : 'pointer'}; opacity: ${hasDownloadedCert ? '0.7' : '1'};" onclick="downloadCert()" ${hasDownloadedCert ? 'disabled' : ''}>
                    ${hasDownloadedCert ? '✅ Skjal sótt' : '🏆 Sækja viðurkenningarskjal'}
                </button>
                <br><br>
                <button class="btn" style="background-color: #5f6368;" onclick="location.reload()">🔄 Byrja nýja umferð</button>
                <div class="feedback-note">Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a></div>
            `;
        } else {
            completionView.innerHTML = `
                <div class="progress-container"><div id="progress-bar" style="width: ${(correctCount/exerciseData.length)*100}%;"></div></div>
                <h1 style="color: #fbbc05; font-size: 2em;">Þú ert næstum því búin(n)!</h1>
                <p style="font-size: 1.2em;">Þú hefur klárað ${correctCount} af ${exerciseData.length} orðum með 100% árangri.</p>
                <p style="font-size: 1.1em; color: #555;">Farðu til baka og reyndu aftur við þau orð sem vantaði upp á til að fá skjalið.</p>
                <button class="btn" style="background-color: #fbbc05; color: #000;" onclick="findNextUnfinished()">➡️ Fara á orð sem vantar</button>
                <div class="feedback-note">Vinsamlegast sendið ábendingar á <a href="mailto:dgu@fb.is">dgu@fb.is</a></div>
            `;
        }
        return;
    }

    const curr = exerciseData[currentIndex];
    const langSelect = document.getElementById('languageSelect');
    const selectedLang = langSelect ? langSelect.value : 'none';

    document.getElementById('target').innerHTML = curr.text;
    document.getElementById('is-explanation').innerHTML = curr.is_exp;
    document.getElementById('counter').innerText = `Orð ${currentIndex + 1} af ${exerciseData.length}`;
    
    const mediaBox = document.getElementById('media-box');
    if (selectedLang === 'none' || selectedLang === "") {
        mediaBox.innerHTML = "<i style='color: #666;'>Vinsamlegast veldu tungumál af listanum að ofan til að sjá þýðingu.</i>";
    } else {
        mediaBox.innerHTML = curr.translations[selectedLang] || "Þýðing ekki til / Translation missing";
    }

    const savedScore = userScores[currentIndex];
    const savedText = userSpoken[currentIndex];

    if (savedScore !== null) {
        document.getElementById('result').innerText = `Einkunn: ${savedScore}%`;
        document.getElementById('spoken').innerText = `Þú sagðir: "${savedText}"`;
    } else {
        document.getElementById('result').innerText = "";
        document.getElementById('spoken').innerText = "";
    }
}

function nextExercise() {
    currentIndex++;
    updateUI();
}

function prevExercise() {
    if (currentIndex > 0) {
        currentIndex--;
        updateUI();
    }
}

function toggleRecord() {
    if (!recognition) return;

    const btn = document.getElementById('record-btn');
    if (isRecording) {
        recognition.stop();
    } else {
        try {
            recognition.start();
            isRecording = true;
            btn.innerText = "🛑 Hlusta...";
            btn.classList.add('recording');
            document.getElementById('result').innerText = "Hlusta...";
            document.getElementById('spoken').innerText = "";
        } catch(e) {
            console.log("Villa í upptöku: " + e);
        }
    }
}

if (recognition) {
    recognition.onresult = (event) => {
        let spoken = event.results[0][0].transcript.trim().toLowerCase(); 
        document.getElementById('spoken').innerText = `Þú sagðir: "${spoken}"`;
        
        const targetWord = exerciseData[currentIndex].text.toLowerCase();
        let score = 0;
        if (spoken.replace(/[.,/#!$%^&*;:{}=\-_`~()]/g,"").trim() === targetWord) {
            score = 100;
        }
        
        document.getElementById('result').innerText = `Einkunn: ${score}%`;
        userScores[currentIndex] = score;
        userSpoken[currentIndex] = spoken;
        
        updateProgress();

        if (score === 100) {
            autoAdvanceTimer = setTimeout(() => {
                nextExercise();
            }, 1000); 
        }
    };
}

function downloadCert() {
    if (hasDownloadedCert) return; 
    const studentNameInput = document.getElementById('studentName');
    const studentName = studentNameInput ? studentNameInput.value.trim() : "";
    
    if (studentName === "") {
        alert("Vinsamlegast skrifaðu nafnið þitt fyrst!");
        return;
    }

    const canvas = document.createElement('canvas');
    canvas.width = 900;
    canvas.height = 600;
    const ctx = canvas.getContext('2d');
    
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = '#1a73e8';
    ctx.lineWidth = 15;
    ctx.strokeRect(20, 20, canvas.width - 40, canvas.height - 40);
    ctx.strokeStyle = '#fbbc05';
    ctx.lineWidth = 5;
    ctx.strokeRect(40, 40, canvas.width - 80, canvas.height - 80);
    
    ctx.fillStyle = '#1a73e8';
    ctx.textAlign = 'center';
    ctx.font = 'bold 50px Arial';
    ctx.fillText('Viðurkenning', canvas.width / 2, 140);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('Þetta skjal staðfestir að', canvas.width / 2, 220);
    
    ctx.fillStyle = '#000000';
    ctx.font = 'bold 45px Arial';
    ctx.fillText(studentName, canvas.width / 2, 290);
    
    ctx.fillStyle = '#333333';
    ctx.font = '24px Arial';
    ctx.fillText('hefur lokið æfingunni með glæsibrag:', canvas.width / 2, 360);

    ctx.fillStyle = '#1a73e8';
    ctx.font = 'bold 26px Arial';
    ctx.fillText('Markorð: 201 - 210 algengustu orðin.', canvas.width / 2, 420);
    
    ctx.fillStyle = '#34a853';
    ctx.font = 'italic 28px Arial';
    ctx.fillText('Frábær árangur! Haltu áfram að æfa þig.', canvas.width / 2, 490);

    const dateString = new Date().toLocaleDateString('is-IS');
    ctx.fillStyle = '#666666';
    ctx.font = '18px Arial';
    ctx.fillText('Dagsetning: ' + dateString, canvas.width / 2, 540);
    
    const link = document.createElement('a');
    link.download = `Vidurkenning_${studentName.replace(/\s+/g, '_')}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    
    hasDownloadedCert = true;
    const btn = document.getElementById('cert-btn');
    if (btn) {
        btn.disabled = true;
        btn.innerText = "✅ Skjal sótt";
        btn.style.backgroundColor = "#5f6368";
        btn.style.cursor = "not-allowed";
        btn.style.opacity = "0.7";
    }
    if (studentNameInput) studentNameInput.disabled = true;
}
</script>
